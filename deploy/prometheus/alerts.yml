groups:
  - name: hypermemory-alerts
    rules:
      - alert: HyperMemory_HighHttpErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="hypermemory",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{application="hypermemory"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on HyperMemory"
          description: "More than 5% of HTTP requests are returning 5xx errors for 5 minutes."

      - alert: HyperMemory_HighQaErrorRate
        expr: |
          sum by (mode) (rate(campus_qa_operation_requests_total{application="hypermemory",status="error"}[5m]))
            / sum by (mode) (rate(campus_qa_operation_requests_total{application="hypermemory"}[5m]))
          > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High QA error rate on HyperMemory (mode {{ $labels.mode }})"
          description: "QA operation error rate for mode {{ $labels.mode }} exceeds 10% over the last 5 minutes."

      - alert: HyperMemory_HighQaLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, mode) (rate(campus_qa_operation_duration_seconds_bucket{application="hypermemory"}[5m]))
          ) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 QA latency on HyperMemory (mode {{ $labels.mode }})"
          description: "P95 QA operation latency for mode {{ $labels.mode }} exceeds 10 seconds."

      - alert: HyperMemory_NoSuccessfulQaTraffic
        expr: |
          absent(rate(campus_qa_operation_requests_total{application="hypermemory",status="success"}[30m]))
            or sum(rate(campus_qa_operation_requests_total{application="hypermemory",status="success"}[30m])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No successful QA traffic on HyperMemory"
          description: "No successful QA operations recorded in the last 30 minutes. May indicate broken ingestion or routing. Disable this alert for low-traffic dev environments."

      - alert: HyperMemory_HighJvmMemoryPressure
        expr: |
          sum(jvm_memory_used_bytes{application="hypermemory",area="heap"})
            / sum(jvm_memory_max_bytes{application="hypermemory",area="heap"})
          > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap memory pressure on HyperMemory"
          description: "JVM heap usage exceeds 85% for 10 minutes. May need memory tuning or investigation."
